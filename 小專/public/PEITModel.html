    <style>

        .textCSStired {
            font-family: 'Noto Sans TC', sans-serif;
            /* 確保字體俐落 */
            font-size: 14px;
            font-weight: bold;
            color: #fca5a5;
            /* 淡淡的楓葉紅/惡魔殺手代表色，比純白更有帶入感 */
            letter-spacing: 1px;
            /* 字距微調，增加易讀性 */

    <style>
        :root {
            /* Twitch 核心調色盤 */
            --tw-bg-darker: #0e0e10;
            /* 最深背景 */
            --tw-bg-card: #18181b;
            /* 區塊背景 */
            --tw-purple: #9147ff;
            /* 亮紫色 */
            --tw-purple-hover: #772ce8;
            /* 深紫色 */
            --tw-text-main: #efeff1;
            /* 主文字 */
            --tw-text-sub: #adadb8;
            /* 次要文字 */
            --tw-border: #26262c;
            /* 邊框色 */
            --tw-input-bg: #1f1f23;
            /* 輸入框背景 */
            --tw-select-hover: #26262c;
            /* 下拉選單滑過顏色 */
        }

        body {
            background-color: var(--tw-bg-darker);
            color: var(--tw-text-main);
            font-family: "Inter", "Roobert", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            cursor: url(./img/鼠標.png), auto;
        }

        /* 主容器：Flex 佈局讓兩台模型左右並排 */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        /* 單個申報模型的卡片樣式 */
        .model-card {
            flex: 1;
            background-color: var(--tw-bg-card);
            border-radius: 8px;
            padding: 30px;
            border: 1px solid var(--tw-border);
            box-sizing: border-box;
        }

        /* 標題樣式 */
        h3 {
            font-size: 1.4rem;
            color: var(--tw-text-main);
            border-bottom: 2px solid var(--tw-border);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        h4 {
            font-size: 1.1rem;
            color: var(--tw-purple);
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* 表單群組：垂直排列表單 */
        .form-group,
        .form-group-hide {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            color: var(--tw-text-sub);
            font-weight: bold;
        }

        /* 輸入框通用美化 */
        .form-input {
            width: 100%;
            background-color: var(--tw-input-bg);
            border: 1px solid var(--tw-border);
            color: var(--tw-text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--tw-purple);
            box-shadow: 0 0 0 2px rgba(145, 71, 255, 0.2);
        }

        /* 唯讀輸入框樣式 */
        .form-input[readonly] {
            background-color: rgba(38, 38, 44, 0.4);
            color: var(--tw-text-sub);
            border-left: 3px solid var(--tw-border);
            cursor: not-allowed;
        }

        /* 計算結果唯讀框強調 */
        .result-input[readonly] {
            border-left: 3px solid var(--tw-purple);
            color: var(--tw-text-main);
            font-weight: bold;
            background-color: rgba(145, 71, 255, 0.05);
        }

        /* 按鈕美化 */
        button {
            flex: 1;
            width: 30%;
            background-color: var(--tw-purple);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            cursor: url(./img/鼠標.png), auto;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--tw-purple-hover);
            transform: scale(1.01);
        }

        button:active {
            transform: scale(0.99);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--tw-border);
            margin: 25px 0;
        }

        /* ==========================================================================
           【100% 解決勾不到】全新改版 Checkbox 樣式
           ========================================================================== */
        .checkbox-group {
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 18px;
            padding: 4px 0;
            width: 100%;
        }

        /* 撐滿寬度 */


        /* 讓原生 checkbox 精準疊在自訂方塊的位置上，並維持可點擊狀態 */
        .checkbox-group input[type="checkbox"] {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            opacity: 0;
            z-index: 3;
            /* 最上層，絕對點得到 */
            /* margin: 0;
            cursor: url(./img/鼠標.png), auto; */
        }

        /* 標籤文字 */
        */ .checkbox-group label {
            position: relative;
            padding-left: 28px;
            color: var(--tw-text-sub);
            font-size: 0.95rem;
            font-weight: bold;
            user-select: none;
            transition: color 0.2s;
            z-index: 1;
            cursor: url(./img/鼠標.png), auto;
        }

        /* 點擊文字也能觸發 */
        /* }

        /* 自訂方塊底色與邊框 */
        .checkbox-group label::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background-color: var(--tw-input-bg);
            border: 1px solid var(--tw-border);
            border-radius: 4px;
            transition: all 0.2s ease;
            z-index: 2;
        }

        /* 懸浮發光 */
        .checkbox-group input[type="checkbox"]:hover+label::before {
            border-color: var(--tw-purple);
        }

        /* 勾選後的色彩轉變 */
        .checkbox-group input[type="checkbox"]:checked+label {
            color: var(--tw-text-main);
        }

        .checkbox-group input[type="checkbox"]:checked+label::before {
            background-color: var(--tw-purple);
            border-color: var(--tw-purple);
            box-shadow: 0 0 8px rgba(145, 71, 255, 0.4);
        }

        /* 白色「✓」勾勾 */
        .checkbox-group input[type="checkbox"]:checked+label::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-57%) rotate(45deg);
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            z-index: 2;
        }

        /* ==========================================================================
           【去醜除白】Select2 專屬 Twitch 暗黑風格完全覆蓋
           ========================================================================== */
        /* 下拉選單框本體 */
        .select2-container--default .select2-selection--single {
            background-color: var(--tw-input-bg) !important;
            border: 1px solid var(--tw-border) !important;
            height: 40px !important;
            border-radius: 6px !important;
            display: flex;
            align-items: center;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--tw-text-main) !important;
            padding-left: 12px !important;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 38px !important;
        }

        /* 下拉展開後的浮動視窗 */
        .select2-dropdown {
            background-color: var(--tw-bg-card) !important;
            border: 1px solid var(--tw-purple) !important;
            color: var(--tw-text-main) !important;
        }

        /* 修正：把圖二中那個醜醜的白色搜尋框徹底黑化 */
        .select2-search--dropdown {
            background-color: var(--tw-bg-card) !important;
            padding: 8px !important;
        }

        .select2-search--dropdown .select2-search__field {
            background-color: var(--tw-input-bg) !important;
            border: 1px solid var(--tw-border) !important;
            color: var(--tw-text-main) !important;
            border-radius: 4px !important;
            outline: none !important;
        }

        /* 修正：當搜尋框聚焦時，改成紫色微光，去掉原本的死白 */
        .select2-search--dropdown .select2-search__field:focus {
            border-color: var(--tw-purple) !important;
        }

        /* 修正：未選中/滑鼠移過去的選項，改成深灰背景（去掉原本亮白） */
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: var(--tw-purple) !important;
            color: white !important;
        }

        /* 修正：已經被選取住的那一欄，在清單中的預設反白顏色（處理圖二的亮灰色） */
        .select2-container--default .select2-results__option[aria-selected=true] {
            background-color: rgba(145, 71, 255, 0.15) !important;
            color: var(--tw-purple) !important;
        }

        /* 滑鼠正常移入其他未選中欄位 */
        .select2-results__option {
            background-color: var(--tw-bg-card) !important;
            color: var(--tw-text-sub) !important;
        }
    </style>
    <style>
        /* 切換按鈕的外殼容器 */
        .toggle-container {
            display: flex;
            background-color: #1e1e24;
            /* 比背景稍微亮一點的深灰色 */
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: fit-content;
        }

        /* 預設按鈕樣式 */
        .toggle-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        /* 被選中時的樣式（搭配你的紫色） */
        .toggle-btn.active {
            background-color: #8b5cf6;
            /* 你的亮紫色 */
            color: #ffffff;
            font-weight: bold;
        }
    </style>
    <!-- 提示框CSS -->
    <style>
        /* 彈出視窗背景（遮罩層） */
        .modal {
            display: none;
            /* 預設隱藏 */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            /* 半透明黑背景 */
            backdrop-filter: blur(4px);
            /* 背景稍微模糊，更有質感 */
        }

        /* 小框框視窗主體 */
        .modal-content {
            background-color: #1e1e1e;
            /* 深灰色背景，搭配你的暗黑模式 */
            color: #ffffff;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #333;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in-out;
        }

        /* 標頭樣式 */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
            color: #a855f7;
            /* 搭配你原本按鈕的紫色系 */
        }

        /* 關閉按鈕 (X) */
        .close-btn {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* 表格樣式 */
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table th,
        .info-table td {
            border: 1px solid #444;
            padding: 10px;
            text-align: left;
        }

        .info-table th {
            background-color: #2d2d2d;
            color: #a855f7;
        }

        .info-table tr:nth-child(even) {
            background-color: #252525;
        }

        /* 彈出動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <!-- 提示文字CSS -->
    <style>
        /* 提示框的樣式 */
        .custom-tooltip {
            position: absolute;
            top: -35px;
            /* 讓它出現在按鈕上方 */
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            display: none;
            /* 預設隱藏 */
        }

        #ADJ {
            position: relative !important;
        }
    </style>
</head>

<script>
    var dataTable = null
    $(document).ready(function () {
        $.ajax({
            url: "/taxJS",
            type: "get",
            success: function (data) {
                dataTable = data;
                findCodeType();
                $("#IC").trigger("change");
                modalOpen()
            }
        })

        function findCodeType() {
            for (let i = 0; i < dataTable.length; i++) {
                var dataCode = dataTable[i].標準代號
                var dataType = dataTable[i].行業名稱
                var dataCodeType = `${dataCode}  ${dataType}`
                var htmlOP = `<option value=${dataCodeType}>${dataCodeType}</option>`
                $("#IC").append(htmlOP)
            }
            findLargeType()
        }

        function findLargeType() {
            $("#IC").on("change", function () {
                let selectedValue = $(this).val();
                if (selectedValue) {
                    let serchcode = selectedValue.substring(0, 8);
                    var findout = dataTable.find(function (e) {
                        return e.標準代號 == serchcode
                    })
                    $("#ISC").val(findout.所屬小業別)
                    let originalData = findout.擴大書審純益率 ? String(findout.擴大書審純益率).trim() : "";
                    if (/^[－\-—]$/.test(originalData)) {
                        $("#PSI").val(originalData);
                    }
                    else if (/\d/.test(originalData)) {
                        $("#PSI").val(originalData + "%");
                    }
                    else {
                        $("#PSI").val(originalData);
                    }
                    $("#SNPM").val(findout.所得額標準 + "%")
                    $("#GPM").val(findout.毛利率 + "%")
                    localStorage.setItem("code", serchcode);
                    localStorage.setItem("GPR", findout.毛利率)
                    localStorage.setItem("NIR", findout.淨利率)
                }
            })
        };



        function modalOpen() {
            $("#findData").on("click", function () {
                $("#infoModal").fadeIn(200);
                let selectedValue = localStorage.getItem("code")
                let serchcode = selectedValue.substring(0, 8);
                var findout = dataTable.find(function (e) {
                    return e.標準代號 == serchcode
                })
                $("#modal-isc").text(findout.所屬小業別)
                $("#modal-code").text(findout.標準代號)
                $("#modal-name").text(findout.行業名稱)
                $("#modal-psi").text(findout.擴大書審純益率)
                $("#modal-income").text(findout.所得額標準)
                $("#modal-gross").text(findout.毛利率)
                $("#modal-expense").text(findout.費用率)
                $("#modal-net").text(findout.淨利率)

                $(".close-btn").click(function () {
                    $("#infoModal").fadeOut(200);
                });
                $(window).click(function (event) {
                    if (event.target == document.getElementById("infoModal")) {
                        $("#infoModal").fadeOut(200);
                    }
                });
            })
        }

    })



</script>

<script>

    $(document).ready(function () {
        var ITRcacu = 0.2
        var ITRs = "20%"
        $("#ITR").val(ITRs)
        // 宣告所得稅率為常域變數
        $("#editITR").on("click", function () {
            $("#ITR").prop("readonly", false).focus()
            $("#ITR").on("input", function () {
                var ITRvalue = $(this).val()
                ITRvalue = ITRvalue.replace('%', '');
                let cleanITRvalue = ITRvalue.replace(/[^0-9]/g, '');
                $("#ITR").val(`${cleanITRvalue}%`)
            })
        })
        // 編輯營所稅率
        $("#lockITR").on("click", function () {
            var ITRvalue = parseInt($("#ITR").val(), 10)
            if (ITRvalue > 100) { alert("請輸入小於100的數字") }
            else { ITRcacu = ITRvalue / 100; $("#ITR").prop("readonly", true) }
        })
        // 鎖定營所稅率
        $("#clear").on("click", function () {
            if ($("#ITR").prop("readonly") === false) {
                alert("執行任何動作前請先鎖定營所稅率！");
                return;
            }
            $("#NSR").val("")
            $("#GP").val("")
            $("#OPEX_she").val("")
            $("#OI").val("")
            $("#result-text").text("")
            $("#ACIT").val("0")
            $("#ADJ_ACIT").val("0")
            $("#ADJ_ACIT_text").text("")
            $("#PAT_A").val("0")
        })
        // 清除資料
        $("#btn-calculate-book").on("click", function () {
            if ($("#ITR").prop("readonly") === false) {
                alert("執行任何動作前請先鎖定營所稅率！");
                return;
            }
            function clear() {
                $("#result-text").text("")
                $("#ACIT").val("0")
                $("#ADJ_ACIT").val("0")
                $("#ADJ_ACIT_text").text("")
                $("#PAT_A").val("0")
            }
            var NRT_text = $("#NSR").val()
            var SSrate_text = $("#PSI").val()
            var ITR_text = $("#ITR").val()
            var NSR = Number($("#NSR").val().replace(/,/g, ''))
            var SSrate = parseFloat($("#PSI").val().replace(/[\(\)]/g, ''))
            var ITR = ITRcacu
            var ACIT = String(Math.round(((NSR * SSrate / 100) * ITR))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
            // 下方宣告調帳預估營所稅所需項目
            var NIR = localStorage.getItem("NIR")
            var ADJACIT = String(Math.round(((NSR * NIR / 100) * ITR))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')


            if (NSR > 30000000) { alert("營業額已超過3000萬無法使用同業利潤標準請改點選所得額標準計算"); clear() }
            else if (NSR == "") { alert("請輸入營業額"); clear() }
            else if (SSrate_text.startsWith('(')) {
                alert("若同業利潤率顯示為『 ( ) 』，原則上應使用所得額標準；但經國稅局核定之特殊情形者，不在此限。");
                $("#ACIT").val(ACIT);
                $("#result-text").text(`年度銷貨收入淨額${NRT_text}*同業利潤率${SSrate_text}*所得稅率${ITR_text}=${ACIT}`)
                $("#ADJ_ACIT").val(ADJACIT);
                $("#ADJ_ACIT_text").text(`年度銷貨收入淨額${NRT_text}*淨利率${NIR}%*所得稅率${ITR_text}=${ADJACIT}`)
                $("#PAT_A").val(String(Math.round(((NSR * NIR / 100) * ITR) - (NSR * SSrate / 100) * ITR)).replace(/\B(?=(\d{3})+(?!\d))/g, ','))


            }
            else if (SSrate_text.startsWith('－')) { alert("若同業利潤率顯示為『－』，代表該行業別不適用書審率核定稅額"); clear(); }
            else {
                $("#ACIT").val(ACIT);
                $("#result-text").text(`年度銷貨收入淨額${NRT_text}*同業利潤率${SSrate_text}*所得稅率${ITR_text}=${ACIT}`)
                $("#ADJ_ACIT").val(ADJACIT);
                $("#ADJ_ACIT_text").text(`年度銷貨收入淨額${NRT_text}*淨利率${NIR}%*所得稅率${ITR_text}=${ADJACIT}`)
                $("#PAT_A").val(String(Math.round(((NSR * NIR / 100) * ITR) - (NSR * SSrate / 100) * ITR)).replace(/\B(?=(\d{3})+(?!\d))/g, ','))
            };


        })
        // 書審按鈕
        $("#btn-calculate-SNPM").on("mouseenter", function () {
            var tooltipText = "年營業額未達 3,000 萬者仍可適用所得額標準。若進項憑證不足或一般費用較少，採所得額標準申報有助於降低帳簿檢查（調帳）之風險。";
            var tooltipHtml = '<div class="custom-tooltip">' + tooltipText + '</div>';

            // 把提示框塞進按鈕內，並用 fadeIn 做出淡入效果
            $(this).append(tooltipHtml);
            $(".custom-tooltip").fadeIn(200);
        });
        // 移入所得額按鈕提示字
        $("#btn-calculate-SNPM").on("mouseleave", function () {
            $(".custom-tooltip").remove();
        });
        // 移出所得額按鈕消失提示字
        $("#btn-calculate-SNPM").on("click", function () {
            if ($("#ITR").prop("readonly") === false) {
                alert("執行任何動作前請先鎖定營所稅率！");
                return;
            }
            function clear() {
                $("#result-text").text("")
                $("#ACIT").val("0")
                $("#ADJ_ACIT").val("0")
                $("#ADJ_ACIT_text").text("")
                $("#PAT_A").val("0")
            }
            var NRT_text = $("#NSR").val()
            var CZrate_text = $("#SNPM").val()
            var ITR_text = $("#ITR").val()
            var NSR = Number($("#NSR").val().replace(/,/g, ''))
            var CZrate = parseFloat($("#SNPM").val())
            var ITR = ITRcacu
            var ACIT = String(Math.round(((NSR * CZrate / 100) * ITR))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
            // 下方宣告調帳預估營所稅所需項目
            var NIR = localStorage.getItem("NIR")
            var ADJACIT = String(Math.round(((NSR * NIR / 100) * ITR))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
            if (NSR == "") { alert("請輸入營業額"); clear() } else {
                $("#ACIT").val(ACIT)
                $("#result-text").text(`年度銷貨收入淨額${NRT_text}*所得額標準${CZrate_text}*所得稅率${ITR_text}=${ACIT}`)
                $("#ADJ_ACIT").val(ADJACIT);
                $("#ADJ_ACIT_text").text(`年度銷貨收入淨額${NRT_text}*淨利率${NIR}%*所得稅率${ITR_text}=${ADJACIT}`)
                $("#PAT_A").val(String(Math.round(((NSR * NIR / 100) * ITR) - (NSR * CZrate / 100) * ITR)).replace(/\B(?=(\d{3})+(?!\d))/g, ','))
            }
        })
        // 所得額標準按鈕
        $("#ADJ_ACIT").on("mouseenter", function () {
            var tooltipText = "若遇抽查調帳且未能提示完整帳簿憑證，國稅局通常將依『同業利潤標準』淨利率進行核定補徵。";
            var tooltipHtml = '<div class="custom-tooltip">' + tooltipText + '</div>';
            // 把提示框塞進按鈕內，並用 fadeIn 做出淡入效果
            $(this).after(tooltipHtml);
            $(".custom-tooltip").css({
                "top": "auto",        /* 拔掉原本讓你飛上天的 top */
                "bottom": "60%",     /* 讓它死死貼在 input 頭頂 */
                "left": "50%",       /* 靠左對齊，往右挪一點比較美 */
                "margin-bottom": "8px",/* 跟紫色輸入框留點空隙 */
                "white-space": "normal", /* 💡 允許文字自動折行，不然字太多會變超長一條 */
                "width": "280px",     /* 設定提示框寬度，字才不會擠在一起 */
                "z-index": "9999",

            })
            $(".custom-tooltip").fadeIn(200);
        });
        // 移入預估調帳所得稅提示字
        $("#ADJ_ACIT").on("mouseleave", function () {
            $(".custom-tooltip").remove();
        });
        // 移出預估調帳所得稅提示字
        $("#btn-calculate-NPMA").on("click", function () {
            if ($("#ITR").prop("readonly") === false) {
                alert("執行任何動作前請先鎖定營所稅率！");
                return;
            }
            function clear() {
                $("#GP").val("")
                $("#OI").val("")
                $("#result-text").text("")
                $("#ACIT").val("0")
                $("#ADJ_ACIT").val("0")
                $("#ADJ_ACIT_text").text("")
                $("#PAT_A").val("0")

            }
            var NRT_text = $("#NSR").val()
            var GPrate_text = $("#GPM").val()
            var ITR_text = $("#ITR").val()
            var NSR = Number($("#NSR").val().replace(/,/g, ''))
            var OPEX = Number($("#OPEX_she").val().replace(/,/g, ''))
            var GPrate = parseFloat($("#GPM").val())
            var ITR = ITRcacu
            var GPcacu = Math.round(((NSR * GPrate / 100)))
            var GP = String(Math.round(((NSR * GPrate / 100)))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')

            // 下方宣告調帳預估營所稅所需項目
            var NIR = localStorage.getItem("NIR")
            var ADJACITcacu = Math.round(((NSR * NIR / 100) * ITR))
            var ADJACIT = String(Math.round(((NSR * NIR / 100) * ITR))).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
            if (NSR == "" || $("#OPEX_she").val() == "") {
                alert("請完整輸入銷貨收入及營業費用金額"); clear()
            } else {
                $("#GP").val(GP);
                var OIcacu = GPcacu - OPEX
                var OI = String(OIcacu).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                var NOI = OI.replace(/^-?/, "(") + ")";

                if (OIcacu < 0) { $("#OI").val(NOI); $("#OI").css("color", "#FF6B6B") }
                else { $("#OI").val(OI).css("color", "#B0B5BC") }
                if (OIcacu < 0) {
                    var ACITcacu = OIcacu * ITR
                    var ACIT = String(ACITcacu).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                    $("#ACIT").val("0"); $("#result-text").text("因營業利益為負，本期營所稅免予計徵（為 0）。");
                    $("#ADJ_ACIT").val(ADJACIT);
                    $("#ADJ_ACIT_text").text(`年度銷貨收入淨額${NRT_text}*淨利率${NIR}%*所得稅率${ITR_text}=${ADJACIT}`)
                    var ACIT_input = Number($("#ACIT").val().replace(/,/g, ''))
                    var PAT_Acacu = ADJACITcacu - ACIT_input
                    var PAT_A = String(PAT_Acacu).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                    $("#PAT_A").val(PAT_A)
                }
                else {
                    var ACITcacu = OIcacu * ITR
                    var ACIT = String(ACITcacu).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                    $("#ACIT").val(ACIT)
                    $("#result-text").text(`年度營業利益${OI}*所得稅率${ITR_text}=${ACIT}`)
                    $("#ADJ_ACIT").val(ADJACIT);
                    $("#ADJ_ACIT_text").text(`年度銷貨收入淨額${NRT_text}*淨利率${NIR}%*所得稅率${ITR_text}=${ADJACIT}`)
                    var ACIT_input = Number($("#ACIT").val().replace(/,/g, ''))
                    var PAT_Acacu = ADJACITcacu - ACIT_input
                    var PAT_A = String(PAT_Acacu).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
                    $("#PAT_A").val(PAT_A)
                }
            }
            var ACITvalue = Number($("#ACIT").val().replace(/,/g, ''))
            var ADJACITvalue = Number($("#ADJ_ACIT").val().replace(/,/g, ''))
            if (ADJACITvalue < ACITvalue) { $("#PAT_A").val("0") }


        })
        // 成本淨決按鈕
        $('#NPMA').change(function () {
            // 使用 prop('checked') 檢查目前是否被勾選，會回傳 true 或 false
            let isChecked = $(this).prop('checked');
            if (isChecked) {
                $("#result-text").text("")
                $("#ACIT").val("0")
                $("#ADJ_ACIT").val("0")
                $("#ADJ_ACIT_text").text("")
                $("#PAT_A").val("0")
            } else {
                $("#result-text").text("")
                $("#ACIT").val("0")
                $("#ADJ_ACIT").val("0")
                $("#ADJ_ACIT_text").text("")
                $("#PAT_A").val("0")
            }
        });
        //轉換成本淨決模式清除結果

    });


</script>
