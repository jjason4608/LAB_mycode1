<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司營業稅及營所稅</title>
    <style>
        :root {
            /* Twitch 核心調色盤 */
            --tw-bg-darker: #0e0e10;
            /* 最深背景 */
            --tw-bg-card: #18181b;
            /* 區塊背景 */
            --tw-purple: #9147ff;
            /* 亮紫色 */
            --tw-purple-hover: #772ce8;
            /* 深紫色 */
            --tw-text-main: #efeff1;
            /* 主文字 */
            --tw-text-sub: #adadb8;
            /* 次要文字 */
            --tw-border: #26262c;
            /* 邊框色 */
            --tw-input-bg: #1f1f23;
            /* 輸入框背景 */
        }

        body {
            background-color: var(--tw-bg-darker);
            color: var(--tw-text-main);
            font-family: "Inter", "Roobert", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            cursor: url(./鼠標.png), auto;
        }

        /* 內容容器 */
        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* 跳轉連結美化 */
        a {
            color: var(--tw-purple);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--tw-text-main);
            text-decoration: underline;
        }

        /* 標題樣式 */
        h3 {
            font-size: 1.4rem;
            color: var(--tw-text-main);
            border-bottom: 2px solid var(--tw-border);
            padding-bottom: 10px;
            margin-top: 40px;
        }

        /* 定義清單美化 */
        dl {
            background-color: var(--tw-bg-card);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--tw-border);
        }

        dt {
            color: var(--tw-purple);
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        dt:first-child {
            margin-top: 0;
        }

        dd {
            margin: 8px 0 0 0;
            color: var(--tw-text-sub);
            font-size: 0.95rem;
            border-left: 3px solid var(--tw-border);
            padding-left: 15px;
        }

        /* 試算區表單美化 */
        label {
            display: inline-block;
            width: 120px;
            color: var(--tw-text-sub);
            margin-bottom: 15px;
            font-weight: 500;
        }

        input[type="text"] {
            background-color: var(--tw-input-bg);
            border: 2px solid var(--tw-border);
            border-radius: 6px;
            color: var(--tw-text-main);
            padding: 8px 12px;
            font-size: 1rem;
            width: 200px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 12px;
        }

        /* 當 User 點擊輸入框時 */
        input[type="text"]:focus {
            border-color: var(--tw-purple);
            cursor: url(./鼠標.png), auto;
        }

        /* 針對 readonly 屬性的特殊樣式（試算結果） */
        input[readonly] {
            background-color: rgba(145, 71, 255, 0.05);
            /* 淡淡的紫色背景 */
            border-color: transparent;
            color: #bf94ff;
            /* 較淺的紫色文字 */
            cursor: not-allowed;
            font-weight: bold;
            cursor: url(./鼠標.png), auto;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--tw-border);
            margin: 30px 0;
        }

        /* 試算結果標題文字 */
        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--tw-purple);
            margin-bottom: 20px;
            display: block;
        }

        .maple-btn {
            width: 180px;
            /* 設定你想要的寬度 */
            height: 80px;
            /* 設定你想要的高度 */
            object-fit: cover;
            /* 關鍵：強制填滿並稍微裁切邊緣 */
            border-radius: 12px;
            /* 加上圓角會更像遊戲按鈕 */
            cursor: pointer;
            transition: transform 0.2s;
            cursor: url(./鼠標.png), auto;
        }

        .maple-btn1:hover {
            transform: scale(1.05);
            /* 增加點擊感：滑鼠移上去會放大 */
        }

        .maple-btn1 {
            width: 280px;
            /* 設定你想要的寬度 */
            height: 180px;
            /* 設定你想要的高度 */
            object-fit: cover;
            /* 關鍵：強制填滿並稍微裁切邊緣 */
            border-radius: 12px;
            /* 加上圓角會更像遊戲按鈕 */
            cursor: pointer;
            transition: transform 0.2s;
            cursor: url(./鼠標.png), auto;
        }


        .maple-btn:hover {
            transform: scale(1.05);
            /* 增加點擊感：滑鼠移上去會放大 */
        }
    </style>
</head>

<body>

    <h3>營業稅(消費稅)</h3>
    <dl>
        <dt>銷項稅額=銷售商品總額*5%</dt>
        <dd>當廠商銷售貨品時須加計銷項稅額售予買方所獲取之銷項稅額扣抵進項稅額繳納給政府</dd>
        <dt>進項稅額=進貨商品總額*5%</dt>
        <dd>當廠商向供應商購買時需支付給對方銷項稅額，此時廠商多付出之5%為進項稅額，對供應商來說則為銷項稅額</dd>
        <dt>應納稅額=銷項稅額-進項稅額-留抵稅額大於0</dt>
        <dd>每個單月份都需產出401申報書進行稅務申報，若銷項稅額-進項稅額-留抵稅額大於0則須繳納該金額給政府</dd>
        <dt>留抵稅額=銷項稅額-進項稅額小於0</dt>
        <dd>當該月份銷項稅額-進項稅額小於0時，該金額將轉成留抵稅額進而用於抵銷下次應納稅額</dd>
    </dl>
    <h3>試算區</h3>
    <label for="ST">銷售商品總額</label>
    <input id="ST" type="text">
    <br>
    <label for="ST1">銷項稅額</label>
    <input id="ST1" type="text" readonly>
    <br>
    <label for="OT">進貨商品總額</label>
    <input id="OT" type="text">
    <br>
    <label for="OT1">進項稅額</label>
    <input id="OT1" type="text" readonly>
    <br>
    <label for="OT2">前期留底稅額</label>
    <input id="OT2" type="text" value="0">
    <br>


    <button onclick="result()"><img class="maple-btn" src="./點擊計算.jpg"></button>
    <button onclick="clearall()"><img class="maple-btn" src="./清空試算區.jpg"></button>
    <hr>
    試算結果
    <br>
    <label for="LT">留抵稅額</label>
    <input id="LT" type="text" readonly>
    <br>
    <label for="PT">應納稅額</label>
    <input id="PT" type="text" readonly>
    <hr>
    <a href=""><img class="maple-btn1" style="width: 300px;" src="./營所稅.jpg"></a>


    <script>
        caculate();
        caculate_2();
        function caculate() {
            let temp0 = parseInt(document.getElementById("ST").value)
            let temp00 = Number(document.getElementById("ST").value)

            let temp1 = Math.round(parseInt(document.getElementById("ST").value) * 0.05)

            document.getElementById("ST1").value = temp1
            if (isNaN(temp00) || temp00 < 0) {
                document.getElementById("ST1").value = "請輸入銷項商品總額"
            }
            if (isNaN(temp0)) {
                document.getElementById("ST1").value = "請輸入銷項商品總額"
            }
        };

        function caculate_2() {
            let temp0 = parseInt(document.getElementById("OT").value)
            let temp00 = Number(document.getElementById("OT").value)
            let temp2 = Math.round(parseInt(document.getElementById("OT").value) * 0.05)
            document.getElementById("OT1").value = temp2

            if (isNaN(temp00) || temp00 < 0) {
                document.getElementById("OT1").value = "請輸入進項商品總額"
            }
            if (isNaN(temp0)) {
                document.getElementById("OT1").value = "請輸入進項商品總額"
            }

        };

        let temp1_x = document.getElementById("ST");
        temp1_x.addEventListener("input", caculate);
        let temp2_x = document.getElementById("OT");
        temp2_x.addEventListener("input", caculate_2)


        function clearall() {
            document.getElementById("ST").value = ""
            document.getElementById("OT").value = ""
            caculate();
            caculate_2();
            document.getElementById("LT").value = ""
            document.getElementById("PT").value = ""
            document.getElementById("OT2").value = 0


        }

        function result() {
            let r1x = parseInt(document.getElementById("ST").value);
            let r2x = parseInt(document.getElementById("ST1").value);
            let r1y = parseInt(document.getElementById("OT").value);
            let r2y = parseInt(document.getElementById("OT1").value);
            let r3x = parseInt(document.getElementById("OT2").value);
            let r1xx = Number(document.getElementById("ST").value);
            let r1yy = Number(document.getElementById("OT").value);
            let r3xx = Number(document.getElementById("OT2").value);



            if (isNaN(r1xx) && !isNaN(r1yy)) {
                alert("請正確輸入銷項總額"); return;
            } else if (!isNaN(r1xx) && isNaN(r1yy)) {
                alert("請正確輸入進項總額"); return;
            } else if (isNaN(r1xx) && isNaN(r1yy)) {
                alert("請正確輸入銷項及進項總額"); return;
            }
            else {
                if (isNaN(r1x) && !isNaN(r1y) || r1x < 0) {
                    alert("請正確輸入銷項總額"); return;
                } else if (!isNaN(r1x) && isNaN(r1y) || r1y < 0) {
                    alert("請正確輸入進項總額"); return;
                } else if (isNaN(r1x) && isNaN(r1y)) {
                    alert("請正確輸入銷項及進項總額"); return;
                }
                else { };
            }

            if (isNaN(r3xx) || r3xx < 0) { alert("請正確輸入留抵稅額") } else {
                if (isNaN(r3x) || r3x < 0) { alert("請正確輸入留抵稅額"); return } else {
                    if (r2x < r2y) {
                        document.getElementById("PT").value = 0
                        document.getElementById("LT").value = r2y - r2x + r3x
                    }

                    else if (r2x > r2y) {
                        document.getElementById("PT").value = r2x - r2y - r3x
                        document.getElementById("LT").value = 0

                    }

                    else if (r2x == r2y) {
                        document.getElementById("PT").value = 0
                        document.getElementById("LT").value = r3x
                    }
                    else if (r2x == 0 && r2y == 0) {
                        document.getElementById("PT").value = 0
                        document.getElementById("LT").value = 0
                    }


                    else {
                        document.getElementById("PT").value = ""
                        document.getElementById("LT").value = ""
                    }
                }
            }

            let rt1 = parseInt(document.getElementById("PT").value)
            let rt2 = parseInt(document.getElementById("LT").value)

            if (rt1 < 0) {
                document.getElementById("LT").value = Math.abs(rt1)
                document.getElementById("PT").value = 0
            }








        }
    </script>




</body>

</html>
